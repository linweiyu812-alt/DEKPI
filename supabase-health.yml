
name: Supabase daily health check

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  check-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Supabase Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing Supabase secrets"
            exit 1
          fi

          HTTP_CODE=$(curl -sS -L \
            --retry 2 \
            --max-time 30 \
            -o /dev/null \
            -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/auth/v1/health")

          echo "Supabase HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Supabase health check failed"
            exit 1
          fi

          echo "Supabase connection successful"

